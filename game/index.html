<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>深宫帝王录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <!-- ====== 角色创建界面 ====== -->
    <div id="screen-create" class="screen active">
        <div class="create-bg"></div>
        <div class="create-container">
            <div class="create-title">
                <h1>深宫帝王录</h1>
                <p class="subtitle">皇权之下，无人幸免</p>
            </div>

            <div class="create-form">
                <div class="form-group">
                    <label>你的名讳</label>
                    <input type="text" id="input-name" placeholder="请输入姓名" maxlength="6">
                </div>

                <div class="form-group">
                    <label>性别</label>
                    <div class="btn-group" id="gender-group">
                        <button class="btn-choice active" data-value="male">皇子</button>
                        <button class="btn-choice" data-value="female">公主</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>生辰</label>
                    <div class="birth-row">
                        <select id="input-month"><option value="">月</option></select>
                        <select id="input-day"><option value="">日</option></select>
                    </div>
                </div>

                <div class="form-group">
                    <label>母妃位分</label>
                    <div class="btn-group" id="mother-rank-group">
                        <button class="btn-choice" data-value="empress">皇后</button>
                        <button class="btn-choice" data-value="consort">贵妃</button>
                        <button class="btn-choice" data-value="concubine">妃</button>
                        <button class="btn-choice" data-value="noble">嫔</button>
                        <button class="btn-choice" data-value="beauty">贵人</button>
                        <button class="btn-choice" data-value="commoner">常在</button>
                        <button class="btn-choice" data-value="promise">答应</button>
                        <button class="btn-choice" data-value="cold">冷宫</button>
                    </div>
                    <p class="form-hint">位分越高，开局越易；位分越低，挑战越大</p>
                </div>

                <div class="form-group">
                    <label>母妃性情</label>
                    <div class="btn-group" id="mother-personality-group">
                        <button class="btn-choice" data-value="schemer">宫斗高手</button>
                        <button class="btn-choice" data-value="naive">天真烂漫</button>
                        <button class="btn-choice" data-value="buddhist">佛系咸鱼</button>
                        <button class="btn-choice" data-value="fierce">人不犯我我不犯人</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>面容</label>
                    <div class="portrait-preview" id="create-portrait"></div>
                    <button class="btn-secondary" id="btn-reroll-portrait">换一换</button>
                </div>

                <button class="btn-primary" id="btn-start">入宫</button>
            </div>
        </div>
    </div>

    <!-- ====== 游戏主界面 ====== -->
    <div id="screen-game" class="screen">
        <!-- 顶部状态栏 -->
        <header id="status-bar">
            <div class="status-row">
                <span class="era" id="ui-era">开元</span>
                <span class="date" id="ui-date">元年正月初一</span>
                <span class="shichen" id="ui-shichen">卯时</span>
            </div>
            <div class="status-row bars">
                <div class="bar-group">
                    <span class="bar-label">圣宠</span>
                    <div class="bar"><div class="bar-fill favor" id="bar-favor"></div></div>
                </div>
                <div class="bar-group">
                    <span class="bar-label">声望</span>
                    <div class="bar"><div class="bar-fill prestige" id="bar-prestige"></div></div>
                </div>
                <div class="bar-group">
                    <span class="bar-label">掌控</span>
                    <div class="bar"><div class="bar-fill control" id="bar-control"></div></div>
                </div>
            </div>
            <div class="status-actions">
                <button class="btn-icon" id="btn-pause" title="暂停/继续">❚❚</button>
                <button class="btn-icon" id="btn-speed" title="加速">▷▷</button>
                <button class="btn-icon" id="btn-skip-event" title="跳至下一事件">⏭</button>
            </div>
        </header>

        <!-- 主内容区 -->
        <main id="game-main">
            <!-- 立绘区 -->
            <div id="portrait-area">
                <div class="portrait-display" id="game-portrait"></div>
                <div class="portrait-name" id="portrait-name"></div>
            </div>

            <!-- 事件日志区 -->
            <div id="event-log">
                <div id="event-list"></div>
            </div>

            <!-- 选项区 -->
            <div id="choice-area">
                <div id="choice-list"></div>
            </div>
        </main>

        <!-- 底部菜单栏 -->
        <nav id="bottom-nav">
            <button class="nav-btn active" data-panel="log">日志</button>
            <button class="nav-btn" data-panel="schedule">行程</button>
            <button class="nav-btn" data-panel="relations">人物</button>
            <button class="nav-btn" data-panel="items">物品</button>
            <button class="nav-btn" data-panel="settings">设置</button>
        </nav>

        <!-- 侧边面板 -->
        <div id="side-panel" class="panel hidden">
            <div class="panel-header">
                <h2 id="panel-title">日志</h2>
                <button class="btn-close" id="btn-close-panel">✕</button>
            </div>
            <div class="panel-body" id="panel-body"></div>
        </div>
    </div>

    <!-- ====== 模态框 ====== -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content" id="modal-content"></div>
    </div>

    <!-- ====== Toast 提示 ====== -->
    <div id="toast-container"></div>

    <script src="js/data.js"></script>
    <script src="js/portrait.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
