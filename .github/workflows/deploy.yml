name: Deploy to GitHub Pages

on:
  push:
    branches: [master, trae/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject build version & timestamp into index.html
        run: |
          TS=$(date -u +"%Y-%m-%d %H:%M UTC")
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          VERSION="b${SHA}-${TS// /_}"
          # Replace placeholder; if absent, leave file untouched.
          if grep -q "__BUILD_VERSION__" index.html; then
            sed -i "s|__BUILD_VERSION__|${VERSION}|g" index.html
            echo "Injected build version: ${VERSION}"
          else
            echo "No __BUILD_VERSION__ placeholder found, skipping injection."
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
